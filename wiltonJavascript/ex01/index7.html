<!DOCTYPE html>
<html>
<head>
  <title>Exercício 7</title>
  <script type="text/javascript">
    var texto = prompt("Digite um texto:");
    var letra = prompt("Digite a letra desejada:").toLowerCase();
    var palavras = texto.trim().split(/\s+/);
    var resultado = [];

    for (var i = 0; i < palavras.length; i++) {
      if (palavras[i].charAt(0).toLowerCase() === letra) {
        resultado.push(palavras[i]);
      }
    }

    document.write(resultado.join(" "));
  </script>
</head>
<body>
</body>
</html>
