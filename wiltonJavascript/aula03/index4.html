<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 6 - Calculadora</title>
</head>
<body>
    <label for="v1">1º Valor:</label>
    <input type="number" id="v1">
    
    <label for="v2">2º Valor:</label>
    <input type="number" id="v2">
    <br><br>

    <button onclick="calcular('+')"> + </button>
    <button onclick="calcular('-')"> - </button>
    <button onclick="calcular('*')"> * </button>
    <button onclick="calcular('/')"> / </button>
    <br><br>

    <label for="resultado">Resultado:</label>
    <input type="text" id="resultado" readonly>

    <script>
        function calcular(operacao) {
            let v1Input = document.getElementById("v1").value;
            let v2Input = document.getElementById("v2").value;

            // Validação: verificar se os números foram digitados
            if (v1Input === "" || v2Input === "") {
                alert("Por favor, digite os valores em ambas as caixas (1º e 2º valor)!");
                return;
            }

            let v1 = Number(v1Input);
            let v2 = Number(v2Input);
            let resultado;

            switch(operacao) {
                case '+': resultado = v1 + v2; break;
                case '-': resultado = v1 - v2; break;
                case '*': resultado = v1 * v2; break;
                case '/': 
                    if (v2 === 0) {
                        alert("Erro: Divisão por zero não é permitida!");
                        return;
                    }
                    resultado = v1 / v2; 
                    break;
            }

            document.getElementById("resultado").value = resultado;
        }
    </script>
</body>
</html>
