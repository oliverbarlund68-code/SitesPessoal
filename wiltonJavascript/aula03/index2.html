<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 3</title>
</head>
<body>
    <label for="valor">Digite um valor:</label>
    <input type="number" id="valor">
    
    <button onclick="mostrarDobro()">Mostrar o dobro</button>
    
    <label for="dobro">Dobro do valor:</label>
    <input type="text" id="dobro" readonly>

    <script>
        function mostrarDobro() {
            let valor = Number(document.getElementById("valor").value);
            let dobro = valor * 2;
            document.getElementById("dobro").value = dobro;
        }
    </script>
</body>
</html>
