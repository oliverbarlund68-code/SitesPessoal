<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2</title>
</head>
<body>
    <h2>Mover Texto com Tempo Selecionável</h2>
    <form id="form2">
        <label>Caixa 1: <input type="text" id="caixa1" placeholder="Digite algo aqui..."></label><br><br>
        <label>Caixa 2: <input type="text" id="caixa2" readonly></label><br><br>
        
        <label>Aguardar por:
            <select id="tempoSegundos">
                <option value="1">1 segundo</option>
                <option value="2">2 segundos</option>
                <option value="3">3 segundos</option>
                <option value="4">4 segundos</option>
                <option value="5">5 segundos</option>
                <option value="6">6 segundos</option>
                <option value="7">7 segundos</option>
                <option value="8">8 segundos</option>
                <option value="9">9 segundos</option>
                <option value="10">10 segundos</option>
            </select>
        </label><br><br>

        <button type="button" id="btnTransferir">Mover Texto</button>
    </form>

    <script src="js/exercicio2.js"></script>
</body>
</html>
