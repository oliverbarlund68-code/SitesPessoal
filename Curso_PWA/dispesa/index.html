<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas de Mercado</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>🛒 Despesas de Mercado</h1>

        <!-- Formulário para Adicionar Item -->
        <form id="form-despesa">
            <div class="input-grupo">
                <label for="produto">Nome do Produto</label>
                <input type="text" id="produto" placeholder="Ex: Arroz, Leite..." required>
            </div>

            <div class="input-grupo">
                <label for="valor">Valor (R$)</label>
                <input type="number" id="valor" step="0.01" min="0" placeholder="0.00" required>
            </div>

            <button type="submit" class="btn-adicionar">Adicionar Item</button>
        </form>

        <!-- Lista de Compras -->
        <div class="lista-container">
            <h2>Itens Adicionados</h2>
            <ul id="lista-itens">
                <!-- Os itens entram aqui via JavaScript -->
            </ul>
        </div>
        <select id="categoria">
           <option>Arroz</option>
           <option>Feijão</option>
           <option>Coca Cola</option>
        </select>

        <div class="input-grupo">
                <label for="categoria">Categoria / Opção</label>
                <select id="categoria" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="Mercearia">🍞 Mercearia / Graos</option>
                    <option value="Hortifruti">🍎 Hortifrúti</option>
                    <option value="Acougue">🥩 Açougue / Carnes</option>
                    <option value="Laticinios">🧀 Laticínios / Frios</option>
                    <option value="Bebidas">🧃 Bebidas</option>
                    <option value="Limpeza">🧹 Limpeza</option>
                    <option value="Higiene">🧴 Higiene Pessoal</option>
                    <option value="Outros">📦 Outros</option>
                </select>
            </div>

        <!-- Total da Compra -->
        <div class="total-container">
            <h3>Total: <span id="valor-total">R$ 0,00</span></h3>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
