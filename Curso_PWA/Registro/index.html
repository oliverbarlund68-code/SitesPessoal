<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Mercado Registro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <div class="nav-wrapper teal">
      <a href="#" class="brand-logo center">Meu Mercado</a>
    </div>
  </nav>

  <main class="container">
    <h4>Lista de compras</h4>
    <p>Organize os produtos que você precisa comprar.</p>

    <div class="card">
      <div class="card-content">
        <span class="card-title">Adicionar produto</span>
        <p>Produtos da lista de Compras</p>

        <div class="input-field">
          <input id="produto" type="text">
          <label for="produto">Nome do produto</label>
        </div>

        <div class="input-field">
          <input id="valor" type="number" step="0.01">
          <label for="valor">Preço (R$)</label>
        </div>

        <button class="btn waves-effect waves-light teal">
          Adicionar
        </button>
      </div>
    </div>
    <h5>Meus produtos</h5>
    <ul class="collection">
      <li class="collection-item">Arroz — R$ 25,00</li>
      <li class="collection-item">Leite — R$ 5,00</li>
    </ul>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="js/script.js" defer></script>
</body>
</html>
