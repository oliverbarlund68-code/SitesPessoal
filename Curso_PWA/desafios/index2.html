<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Escolar</title>
    <!-- Vincula o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Calculadora de Média</h2>
        
        <div class="input-group">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" step="0.1" min="0" max="10" placeholder="Ex: 7.5">
        </div>

        <div class="input-group">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" step="0.1" min="0" max="10" placeholder="Ex: 8.0">
        </div>

        <div class="input-group">
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" step="0.1" min="0" max="10" placeholder="Ex: 6.5">
        </div>

        <button id="btnCalcular">Calcular Média</button>

        <div class="resultado" id="resultado"></div>
    </div>

    <!-- Vincula o arquivo JavaScript externo -->
    <script src="js/script.js"></script>
</body>
</html>
