<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 7</title>
</head>
<body>
    <script>
        alert("Você deverá informar 3 valores numéricos para RGB. Cada valor deve estar dentro do intervalo [0, 255].");
        
        var r = prompt("Digite o valor para R (Red) [0-255]:");
        var g = prompt("Digite o valor para G (Green) [0-255]:");
        var b = prompt("Digite o valor para B (Blue) [0-255]:");

        document.write("<p style='color: rgb(" + r + "," + g + "," + b + ");'>Fundamentos de Web Design II</p>");
    </script>
</body>
</html>
