<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 10</title>
</head>
<body>
    <script>
        var x = parseInt(prompt("Digite um valor inteiro positivo maior que zero:"));
        var nome = prompt("Digite seu nome completo:");

        for (var i = 0; i < x; i++) {
            document.write(nome + "<br>");
        }
    </script>
</body>
</html>
