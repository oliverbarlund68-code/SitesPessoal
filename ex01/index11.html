<!DOCTYPE html>
<html>
<head>
  <title>Exercício 11</title>
  <script type="text/javascript">
    var texto = prompt("Informe um texto:");
    var palavra1 = prompt("Informe a primeira palavra (a ser substituída):");
    var palavra2 = prompt("Informe a segunda palavra (a substituta):");

    // Substitui todas as ocorrências da palavra1 pela palavra2
    var textoAlterado = texto.split(palavra1).join(palavra2);

    alert(textoAlterado);
  </script>
</head>
<body>
</body>
</html>
