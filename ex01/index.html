<!DOCTYPE html>
<html>
<head>
  <title>Exercício 1</title>
  <script type="text/javascript">
    var primeiroNome = prompt("Digite o seu primeiro nome:");
    var sobrenome = prompt("Digite o seu sobrenome:");
    var nomeCompleto = primeiroNome + " " + sobrenome;
    var n = parseInt(prompt("Digite a quantidade de vezes a exibir:"));
    var corUsuario = prompt("Digite a cor para o nome (ex: red, blue, green, #ff0000):");

    for (var i = 1; i <= n; i++) {
      var cor = (i % 2 !== 0) ? "black" : corUsuario;
      document.write("<p style='color:" + cor + ";'>" + i + " - " + nomeCompleto + "</p>");
    }
  </script>
</head>
<body>
</body>
</html>
