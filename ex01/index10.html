<!DOCTYPE html>
<html>
<head>
  <title>Exercício 10</title>
  <script type="text/javascript">
    var num = parseInt(prompt("Digite um valor inteiro positivo (>= 2):"));

    if (!isNaN(num) && num >= 2) {
      document.write("<table border='1' cellpadding='5' cellspacing='0'>");
      document.write("  <tr>");
      document.write("    <th>Base decimal</th>");
      document.write("    <th>Base binária</th>");
      document.write("    <th>Base hexadecimal</th>");
      document.write("  </tr>");

      for (var i = 0; i <= num; i++) {
        document.write("  <tr>");
        document.write("    <td>" + i + "</td>");
        document.write("    <td>" + i.toString(2) + "</td>");
        document.write("    <td>" + i.toString(16).toUpperCase() + "</td>");
        document.write("  </tr>");
      }

      document.write("</table>");
    } else {
      alert("Por favor, insira um número inteiro maior ou igual a 2.");
    }
  </script>
</head>
<body>
</body>
</html>
